name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Baixar APK base do release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk-base --pattern ikemen-go.apk --repo ${{ github.repository }}

      - name: Extrair libs e assets do APK base
        run: |
          unzip -q ikemen-go.apk 'lib/arm64-v8a/*' 'assets/*' -d base
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp base/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp -r base/assets/. app/src/main/assets/

      - name: Aceitar licencas do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ikemen-go-novo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
